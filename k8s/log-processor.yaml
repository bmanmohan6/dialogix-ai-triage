apiVersion: apps/v1
kind: Deployment
metadata:
  name: dialogix-log-processor
  labels:
    app: log-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-processor
  template:
    metadata:
      labels:
        app: log-processor
    spec:
      containers:
      - name: log-processor
        image: 801246775950.dkr.ecr.us-east-1.amazonaws.com/dialogix-log-processor:latest
        ports:
        - containerPort: 8000
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_DEFAULT_REGION
---
apiVersion: v1
kind: Service
metadata:
  name: log-processor-service
spec:
  selector:
    app: log-processor
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer